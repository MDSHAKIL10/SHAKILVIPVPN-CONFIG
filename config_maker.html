<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;font-family:sans-serif}
body{margin:0;background:#0a0e17;color:#fff;padding-bottom:80px}
.top{background:#1e3a5f;padding:14px;display:flex;justify-content:space-between;align-items:center}
.btn{background:#0284c7;color:#fff;border:none;padding:8px 12px;border-radius:6px;font-weight:bold}
.box{padding:14px}
.card{background:#f8fafc;color:#0f172a;padding:12px;border-radius:8px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.fab{position:fixed;bottom:70px;right:18px;width:52px;height:52px;border-radius:50%;background:#0284c7;color:#fff;font-size:26px;border:none}
.nav{position:fixed;bottom:0;width:100%;background:#1e3a5f;display:flex}
.nav div{flex:1;text-align:center;padding:14px;font-weight:bold;color:#94a3b8}
.nav .act{color:#fff;border-top:3px solid #38bdf8}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);padding:20px;z-index:9}
.mbox{background:#131a2a;padding:16px;border-radius:10px}
input,select{width:100%;padding:10px;margin:6px 0 12px;background:#0a0e17;color:#fff;border:1px solid #334155;border-radius:6px}
</style>
</head>
<body>
<div class="top"><b>SHAKILVIPVPN Gen</b><button class="btn" id="upBtn" onclick="push()">☁️ UPDATE</button></div>
<div id="v-home" class="box" style="display:none"><div class="mbox"><b>GitHub Token</b><input type="password" id="tk" placeholder="ghp_..."><button class="btn" style="width:100%" onclick="saveTk()">Save Token</button></div></div>
<div id="v-srv" class="box"></div>
<div id="v-pay" class="box" style="display:none"></div>
<button class="fab" id="fab" onclick="openM()">+</button>
<div class="nav"><div onclick="tab('home',this)">HOME</div><div class="act" onclick="tab('srv',this)">SERVER</div><div onclick="tab('pay',this)">PAYLOAD</div></div>
<div class="modal" id="mod"><div class="mbox"><h4 id="mt">Add</h4><div id="mf"></div><button class="btn" style="width:100%" onclick="saveI()">Save</button><button class="btn" style="width:100%;background:#475569;margin-top:8px" onclick="closeM()">Close</button></div></div>
<script>
const OW="MDSHAKIL10",RP="SHAKILVIPVPN-CONFIG",FL="servers.svip",KY="SHAKILVIPVPN_2026_LOCK";
let cur="srv",ei=-1,db=JSON.parse(localStorage.getItem("svip_db"))||{
servers:[
{name:"🇩🇪 DE UDP (Hysteria)",protocol:"hysteria1",host:"91.107.175.87",port:"20000-50000",obfs:"kobe"},
{name:"🇸🇬 SG VLESS 443",protocol:"v2ray",host:"v2.skvps.xyz",port:"443",tls:true},
{name:"🇸🇬 SG VLESS 80",protocol:"v2ray",host:"v2.skvps.xyz",port:"80",tls:false}
],
payloads:[
{name:"⚡ UDP Auto-Mode",mode:"udp",path:"",sni:"",bugHost:""},
{name:"🇸🇦 STC 443 Business",mode:"443",path:"/ws-kobe",sni:"stc.com.sa",bugHost:"dns2-448947328279.europe-west3.run.app"},
{name:"🇧🇩 Free Net 80 WS",mode:"80",path:"/ws-kobe",sni:"",bugHost:"://facebook.com"}
]};
window.onload=()=>{document.getElementById("tk").value=localStorage.getItem("svip_tk")||"";draw();};
function tab(t,el){cur=t;document.querySelectorAll(".nav div").forEach(x=>x.className="");el.className="act";
["home","srv","pay"].forEach(x=>document.getElementById("v-"+x).style.display=x===t?"block":"none");
document.getElementById("fab").style.display=t==="home"?"none":"block";}
function draw(){localStorage.setItem("svip_db",JSON.stringify(db));
document.getElementById("v-srv").innerHTML=db.servers.map((s,i)=>`<div class="card"><div><b>${s.name}</b><br><small>${s.protocol} • ${s.host}:${s.port}</small></div><div><button onclick="openM(${i})">✏️</button> <button onclick="del('servers',${i})">✖</button></div></div>`).join("");
document.getElementById("v-pay").innerHTML=db.payloads.map((p,i)=>`<div class="card"><div><b>${p.name}</b><br><small>Mode: ${p.mode} • SNI: ${p.sni}</small></div><div><button onclick="openM(${i})">✏️</button> <button onclick="del('payloads',${i})">✖</button></div></div>`).join("");}
function openM(i=-1){ei=i;const f=document.getElementById("mf");
if(cur==="srv"){const s=i>=0?db.servers[i]:{name:"",protocol:"v2ray",host:"",port:"443",obfs:"kobe"};
f.innerHTML=`Name:<input id="a1" value="${s.name}">Type:<select id="a2"><option value="v2ray" ${s.protocol==="v2ray"?"selected":""}>V2Ray</option><option value="hysteria1" ${s.protocol==="hysteria1"?"selected":""}>UDP Hysteria</option></select>Host:<input id="a3" value="${s.host}">Port:<input id="a4" value="${s.port}">Obfs:<input id="a5" value="${s.obfs||"kobe"}">`;}
else{const p=i>=0?db.payloads[i]:{name:"",mode:"443",path:"/ws-kobe",sni:"",bugHost:""};
f.innerHTML=`Name:<input id="b1" value="${p.name}">Mode:<select id="b2"><option value="udp" ${p.mode==="udp"?"selected":""}>UDP Only</option><option value="443" ${p.mode==="443"?"selected":""}>443 TLS Only</option><option value="80" ${p.mode==="80"?"selected":""}>80 WS Only</option></select>Path:<input id="b3" value="${p.path}">SNI:<input id="b4" value="${p.sni}">BugHost:<input id="b5" value="${p.bugHost}">`;}
document.getElementById("mod").style.display="block";}
function closeM(){document.getElementById("mod").style.display="none";}
function saveI(){if(cur==="srv"){const pt=document.getElementById("a4").value.trim();const o={name:document.getElementById("a1").value,protocol:document.getElementById("a2").value,host:document.getElementById("a3").value,port:pt,obfs:document.getElementById("a5").value,tls:pt==="443"};if(ei>=0)db.servers[ei]=o;else db.servers.push(o);}
else{const o={name:document.getElementById("b1").value,mode:document.getElementById("b2").value,path:document.getElementById("b3").value,sni:document.getElementById("b4").value,bugHost:document.getElementById("b5").value};if(ei>=0)db.payloads[ei]=o;else db.payloads.push(o);}
closeM();draw();}
function del(t,i){db[t].splice(i,1);draw();}
function saveTk(){const clean=document.getElementById("tk").value.replace(/[^a-zA-Z0-9_]/g,"");localStorage.setItem("svip_tk",clean);document.getElementById("tk").value=clean;alert("Token Saved!");}
function enc(t){let e="";for(let i=0;i<t.length;i++)e+=String.fromCharCode(t.charCodeAt(i)^KY.charCodeAt(i%KY.length));return"SVIP1::"+btoa(unescape(encodeURIComponent(e)));}
async function push(){const tk=(localStorage.getItem("svip_tk")||"").replace(/[^a-zA-Z0-9_]/g,"");if(!tk){alert("আগে HOME ট্যাবে Token দিন!");return;}
const b=document.getElementById("upBtn");b.innerText="⏳...";const c=btoa(enc(JSON.stringify(db)));
const u="https://github.com"+OW+"/"+RP+"/contents/"+FL;
const hdr={"Authorization":"token "+tk,"Accept":"application/vnd.github.v3+json","Content-Type":"application/json"};
try{let sha="";const g=await fetch(u+"?t="+Date.now(),{headers:hdr});if(g.ok)sha=(await g.json()).sha;
const p=await fetch(u,{method:"PUT",headers:hdr,body:JSON.stringify({message:"Up",content:c,branch:"server_script",sha:sha||undefined})});
if(p.ok){b.innerText="✅ DONE";}else{const err=await p.text();alert("GitHub Error "+p.status+": "+err);b.innerText="❌ ERR";}
setTimeout(()=>b.innerText="☁️ UPDATE",2500);}catch(e){alert("Network/Token Error: "+e);b.innerText="☁️ UPDATE";}}
</script>
</body>
</html>
