name: Build SHAKILVIPVPN Gen APK
on:
  push:
    branches: [ server_script, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Build Native Flutter Gen APK
        run: |
          flutter create --org com.shakilvipvpn.gen --project-name shakilgen app
          cp gen_app.dart app/lib/main.dart
          cd app
          flutter pub add http shared_preferences
          flutter build apk --release --no-shrink
      - name: Upload Gen APK
        uses: actions/upload-artifact@v4
        with:
          name: SHAKILVIPVPN-Gen-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
