name: Build SHAKILVIPVPN Gen APK
on:
  push:
    branches: [ server_script, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build Android Gen APK
        run: |
          mkdir -p www && cp config_maker.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.shakilvipvpn.gen",
            "appName": "SHAKILVIPVPN Gen",
            "webDir": "www",
            "plugins": {
              "CapacitorHttp": {
                "enabled": true
              }
            }
          }
          EOF
          npx cap add android
          npx cap sync android
          cat << 'EOF' >> android/app/build.gradle
          dependencies {
              implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
          }
          EOF
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload Gen APK
        uses: actions/upload-artifact@v4
        with:
          name: SHAKILVIPVPN-Gen-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
